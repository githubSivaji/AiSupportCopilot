spring.application.name=ai-support-copilot

# PostgreSQL (Neon)
spring.datasource.url=jdbc:postgresql://ep-jolly-paper-azppsg9l-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=neondb_owner
spring.datasource.password=npg_VM65PHhJKyLa

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actuator
management.endpoints.web.exposure.include=health,info,metrics

# JWT
app.jwt.secret=change-this-development-secret-key-to-a-long-random-value
app.jwt.expiration=3600000

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.6-flash

# Google GenAI Embedding (API key based — not Vertex AI)
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.model=text-embedding-004

# PgVector store — no index (HNSW/IVFFlat both cap at 2000 dims, model outputs 3072)
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=3072
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=NONE

resilience4j.circuitbreaker.instances.gemini.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.gemini.sliding-window-size=10

resilience4j.circuitbreaker.instances.gemini.failure-rate-threshold=50

resilience4j.circuitbreaker.instances.gemini.wait-duration-in-open-state=10s

resilience4j.circuitbreaker.instances.gemini.permitted-number-of-calls-in-half-open-state=2

resilience4j.circuitbreaker.instances.gemini.minimum-number-of-calls=5
